name: CI

on:
  pull_request:

jobs:
  test:
    name: Test and check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Check
        run: bun run check

      - name: Verify check did not rewrite tracked files
        run: git diff --exit-code
